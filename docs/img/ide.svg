  <text x="174" y="440" fill="#f38ba8" font-size="10" font-family="monospace">1 error</text>
  <text x="234" y="440" fill="#6c7086" font-size="10" font-family="monospace">0 avisos</text>
  <line x1="300" y1="430" x2="300" y2="442" stroke="#313244"/>
  <text x="318" y="440" fill="#6c7086" font-size="10" font-family="monospace">18 ms</text>
  <text x="852" y="440" fill="#6c7086" font-size="10" font-family="monospace" text-anchor="end">Compiscript &#183; ANTLR 4.13.1</text>
