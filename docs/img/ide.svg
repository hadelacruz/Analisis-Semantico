    <text x="652" y="192" fill="#fab387">"this"</text>
    <text x="700" y="192" fill="#6c7086" font-size="8">5:14</text>

    <text x="652" y="210" fill="#fab387">"precio"</text>
    <rect x="712" y="201" width="34" height="12" rx="3" fill="#a6e3a1" opacity="0.18"/>
