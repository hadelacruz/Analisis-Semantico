    <text x="705" y="228" fill="#a6e3a1" font-size="8" text-anchor="middle">integer</text>

    <text x="566" y="252" fill="#6c7086">&#9656;</text>
    <text x="580" y="252" fill="#89b4fa">variableDeclaration</text>
