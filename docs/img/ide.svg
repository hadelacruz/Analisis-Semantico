  <text x="26" y="346" fill="#f38ba8" font-size="10">&#10006;</text>
  <text x="44" y="346" fill="#f38ba8" font-size="10" font-family="monospace" font-weight="700">E105</text>
  <text x="86" y="346" fill="#cdd6f4" font-size="10.5">No se puede inicializar 'x' de tipo 'integer' con un valor de tipo 'string'.</text>
