[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiscript"
version = "1.0.0"
description = "Analizador sintactico y semantico del lenguaje Compiscript (ANTLR4 + Python)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
compiscript = "compiscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
    "tipos: reglas del sistema de tipos (E1xx)",
    "ambito: reglas de manejo de ambito (E2xx)",
    "funciones: reglas de funciones y procedimientos (E3xx)",
    "flujo: reglas de control de flujo (E4xx)",
    "clases: reglas de clases y objetos (E5xx)",
    "listas: reglas de listas y estructuras (E6xx)",
    "generales: reglas generales y advertencias (E7xx, W9xx)",
    "tabla: tabla de simbolos y entornos",
]
